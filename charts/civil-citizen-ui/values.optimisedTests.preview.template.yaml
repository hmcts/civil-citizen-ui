# Applied when a PR has the single `pr-values:optimisedTests` label. This keeps
# the real services used by the migrated thin-client scenarios and removes
# preview components those scenarios do not call. WireMock is present for
# migrated scenarios that have no real-service boundary.

civil-service:
  ccd:
    postgresql:
      setup:
        databases:
          - name: "pr-${CHANGE_ID}-cmc"
          - name: "pr-${CHANGE_ID}-data-store"
          - name: "pr-${CHANGE_ID}-definition-store"
          - name: "pr-${CHANGE_ID}-camunda"
          - name: "pr-${CHANGE_ID}-role-assignment"
  xui-webapp:
    enabled: false
  em-stitching:
    enabled: false
  em-ccdorc:
    enabled: false

nodejs:
  environment:
    FUNCTIONAL_TEST_ROUTER_URL: http://${SERVICE_NAME}-wiremock
    FUNCTIONAL_TEST_ROUTER_TOKEN: ${SERVICE_NAME}
    PCQ_URL: https://${SERVICE_FQDN}

wiremock:
  enabled: true
  image: wiremock/wiremock
  applicationPort: 8080
  imagePullPolicy: Always
  releaseNameOverride: ${SERVICE_NAME}-wiremock
  # Browser traffic and test administration both pass through CUI. WireMock has
  # no public ingress of its own.
  ingressHost: ""
  verbose: true
  volumes:
    - name: wiremock-mappings
      configMap:
        name: ${SERVICE_NAME}-wiremock-mappings
    - name: wiremock-files
      configMap:
        name: ${SERVICE_NAME}-wiremock-files
  volumeMounts:
    - name: wiremock-mappings
      mountPath: /home/wiremock/mappings
    - name: wiremock-files
      mountPath: /home/wiremock/__files
