# Applied when a PR has the single `pr-values:optimisedTests` label. The full
# preview remains deployed; WireMock is a switchable router for the functional
# phase, not a second environment.

nodejs:
  environment:
    CIVIL_SERVICE_URL: http://${SERVICE_NAME}-wiremock
    FUNCTIONAL_TEST_ROUTER_URL: http://${SERVICE_NAME}-wiremock
    FUNCTIONAL_TEST_ROUTER_TOKEN: ${SERVICE_NAME}
    ORDNANCE_SURVEY_API_URL: http://${SERVICE_NAME}-wiremock
    ORDNANCE_SURVEY_API_KEY: mock-key
    PCQ_URL: https://${SERVICE_FQDN}

wiremock:
  enabled: true
  image: wiremock/wiremock
  applicationPort: 8080
  imagePullPolicy: Always
  releaseNameOverride: ${SERVICE_NAME}-wiremock
  # Browser traffic and test administration both pass through CUI. WireMock has
  # no public ingress of its own.
  ingressHost: ""
  verbose: true
  volumes:
    - name: wiremock-mappings
      configMap:
        name: ${SERVICE_NAME}-wiremock-mappings
    - name: wiremock-files
      configMap:
        name: ${SERVICE_NAME}-wiremock-files
  volumeMounts:
    - name: wiremock-mappings
      mountPath: /home/wiremock/mappings
    - name: wiremock-files
      mountPath: /home/wiremock/__files
