name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - refs/tags/*
    tags:
      - '*'

env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  unit-tests:
    name: Unit tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      JEST_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          # Jenkins tests the PR head, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      - name: Build assets required by unit fixtures
        run: yarn build
      - name: Unit tests and coverage
        run: yarn test:coverage
      - name: Publish coverage for Jenkins Sonar
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            coverage/lcov.info
            coverage/unit-coverage.json
          if-no-files-found: error
          retention-days: 14

  pii-log-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install Semgrep
        run: |
          python -m pip install semgrep==1.137.0
          python -m pip install pydantic==2.11.7
          python -m pip check
          python -c "from mcp.server.fastmcp import FastMCP; print('MCP import successful')"
      - name: Test PII logging rules
        run: semgrep test .semgrep
      - name: Scan changed application code for PII logging
        env:
          SEMGREP_BASELINE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          semgrep scan --strict --metrics=off --no-rewrite-rule-ids \
            --config .semgrep/logging-pii.yml \
            --json-output semgrep-results.json \
            src/main
          python .semgrep/annotate.py semgrep-results.json

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install
        env:
          YARN_ENABLE_HARDENED_MODE: '1'
        run: yarn install
      - name: Check dependency pins and lockfile checksums
        run: yarn deps:check
      - name: Audit dependencies
        run: yarn deps:audit
      - name: Build
        run: yarn build
      - name: Pull WireMock mappings
        run: yarn wiremock:pull
